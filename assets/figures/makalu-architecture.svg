<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace"><rect width="100%" height="100%" fill="#ffffff"/>
    <title id="f1t">Text goes through the frozen Qwen3 encoder with LoRA adapters in all 28 layers, last-token pooling and L2 normalisation; the unit vector feeds either the choice scorer or the verifier head.</title>
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#78828e"></path></marker></defs>
    <!-- input -->
    <rect x="10" y="160" width="150" height="76" rx="10" fill="#ffffff" stroke="#dbe0e6"></rect>
    <text x="85" y="188" text-anchor="middle" fill="#121820" font-size="13">text</text>
    <text x="85" y="208" text-anchor="middle" fill="#78828e" font-size="10.5">state, option or</text>
    <text x="85" y="223" text-anchor="middle" fill="#78828e" font-size="10.5">attempt summary</text>
    <path d="M160 198 H200" stroke="#78828e" stroke-width="1.5" marker-end="url(#ar)"></path>
    <!-- encoder -->
    <rect x="205" y="30" width="270" height="336" rx="14" fill="#ffffff" stroke="#1f6fb2" stroke-width="2"></rect>
    <text x="340" y="56" text-anchor="middle" fill="#121820" font-size="14" font-weight="600">Qwen3-Embedding-0.6B</text>
    <text x="340" y="74" text-anchor="middle" fill="#78828e" font-size="10.5">28 layers · frozen base weights</text>
    <g id="layers"><rect x="230" y="92" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="107" text-anchor="middle" fill="#46505c" font-size="10.5">layer 1</text><rect x="408" y="95" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="107" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="121" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="136" text-anchor="middle" fill="#46505c" font-size="10.5">layer 2</text><rect x="408" y="124" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="136" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="150" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="165" text-anchor="middle" fill="#46505c" font-size="10.5">layer 3</text><rect x="408" y="153" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="165" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="179" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="194" text-anchor="middle" fill="#46505c" font-size="10.5">layer 4</text><rect x="408" y="182" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="194" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="208" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="223" text-anchor="middle" fill="#46505c" font-size="10.5">layer 5</text><rect x="408" y="211" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="223" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="237" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="252" text-anchor="middle" fill="#46505c" font-size="10.5">layer 6</text><rect x="408" y="240" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="252" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text><rect x="230" y="266" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="281" text-anchor="middle" fill="#46505c" font-size="10.5">⋮</text><rect x="230" y="295" width="170" height="22" rx="5" fill="#f4f6f8" stroke="#dbe0e6"></rect><text x="315" y="310" text-anchor="middle" fill="#46505c" font-size="10.5">layer 28</text><rect x="408" y="298" width="42" height="16" rx="4" fill="#1f6fb2" opacity="0.85"></rect><text x="429" y="310" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="600">LoRA</text></g>
    <text x="340" y="342" text-anchor="middle" fill="#46505c" font-size="10.5">LoRA r = 16, α = 32 on q, k, v, o,</text>
    <text x="340" y="357" text-anchor="middle" fill="#46505c" font-size="10.5">gate, up, down · 10.09M parameters</text>
    <path d="M475 198 H515" stroke="#78828e" stroke-width="1.5" marker-end="url(#ar)"></path>
    <!-- pooling -->
    <rect x="520" y="150" width="120" height="96" rx="10" fill="#ffffff" stroke="#dbe0e6"></rect>
    <text x="580" y="180" text-anchor="middle" fill="#121820" font-size="12">last token</text>
    <text x="580" y="198" text-anchor="middle" fill="#121820" font-size="12">pooling</text>
    <text x="580" y="222" text-anchor="middle" fill="#78828e" font-size="10.5">→ unit vector</text>
    <text x="580" y="236" text-anchor="middle" fill="#78828e" font-size="10.5">1024-d</text>
    <path d="M640 180 L700 110" stroke="#78828e" stroke-width="1.5" marker-end="url(#ar)"></path>
    <path d="M640 216 L700 292" stroke="#78828e" stroke-width="1.5" marker-end="url(#ar)"></path>
    <!-- choice scorer -->
    <rect x="705" y="40" width="185" height="128" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="2"></rect>
    <text x="797" y="66" text-anchor="middle" fill="#121820" font-size="13" font-weight="600">choice scorer</text>
    <text x="797" y="90" text-anchor="middle" fill="#121820" font-size="10.5">p = softmax(α·cos(s, oₖ))</text>
    <text x="797" y="114" text-anchor="middle" fill="#78828e" font-size="10.5">passages, answers,</text>
    <text x="797" y="129" text-anchor="middle" fill="#78828e" font-size="10.5">agent actions</text>
    <text x="797" y="153" text-anchor="middle" fill="#78828e" font-size="10.5">1 parameter (α)</text>
    <!-- verifier -->
    <rect x="705" y="228" width="185" height="128" rx="10" fill="#ffffff" stroke="#b0590c" stroke-width="2"></rect>
    <text x="797" y="254" text-anchor="middle" fill="#121820" font-size="13" font-weight="600">verifier head</text>
    <text x="797" y="278" text-anchor="middle" fill="#121820" font-size="12">P(pass) = σ(w·e + b)</text>
    <text x="797" y="302" text-anchor="middle" fill="#78828e" font-size="10.5">finished coding</text>
    <text x="797" y="317" text-anchor="middle" fill="#78828e" font-size="10.5">attempts</text>
    <text x="797" y="341" text-anchor="middle" fill="#78828e" font-size="10.5">1,025 parameters</text>
  </svg>