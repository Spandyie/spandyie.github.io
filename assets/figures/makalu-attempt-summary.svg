    <g id="summary"><text x="20" y="30" fill="#46505c" font-size="11">Instruct: Given a coding agent's attempt, judge whether it resolves the task.</text><rect x="20" y="50" width="211" height="60" rx="6" fill="#2a78d6" opacity="0.18" stroke="#2a78d6"></rect><text x="30" y="76" fill="#121820" font-size="12.5" font-weight="600">Task</text><text x="30" y="96" fill="#46505c" font-size="10.5">the issue text</text><text x="125.5" y="132" text-anchor="middle" fill="#78828e" font-size="10.5">512 tokens</text><rect x="235" y="50" width="318.5" height="60" rx="6" fill="#1baf7a" opacity="0.18" stroke="#1baf7a"></rect><text x="245" y="76" fill="#121820" font-size="12.5" font-weight="600">Final diff</text><text x="245" y="96" fill="#46505c" font-size="10.5">the code change</text><text x="394.25" y="132" text-anchor="middle" fill="#78828e" font-size="10.5">768 tokens</text><rect x="557.5" y="50" width="157.25" height="60" rx="6" fill="#eb6834" opacity="0.18" stroke="#eb6834"></rect><text x="567.5" y="76" fill="#121820" font-size="12.5" font-weight="600">Last test run</text><text x="567.5" y="96" fill="#46505c" font-size="10.5">its output</text><text x="636.125" y="132" text-anchor="middle" fill="#78828e" font-size="10.5">384 tokens</text><rect x="718.75" y="50" width="103.5" height="60" rx="6" fill="#b0590c" opacity="0.18" stroke="#b0590c"></rect><text x="728.75" y="76" fill="#121820" font-size="12.5" font-weight="600">Last actions</text><text x="728.75" y="96" fill="#46505c" font-size="10.5">6 commands</text><text x="770.5" y="132" text-anchor="middle" fill="#78828e" font-size="10.5">256 tokens</text><path d="M20 150 V158 H876 V150" fill="none" stroke="#78828e"></path><text x="450" y="178" text-anchor="middle" fill="#46505c" font-size="11">≤ 2,048 tokens → one embedding e → P(pass)</text><text x="450" y="205" text-anchor="middle" fill="#78828e" font-size="10.5">field widths drawn to scale of their token budgets</text></g>
