<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="https://spandanm.com/assets/images/profile-400.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="https://spandanm.com/assets/images/profile-400.jpg">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://giscus.app; frame-src https://giscus.app;">
  <title>{{ page.title | default: site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════ Design System ═══════════════════ */
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-hover: #e9ecef;
      --border: #dee2e6;
      --text: #212529;
      --text-dim: #495057;
      --text-muted: #6c757d;
      --accent: #2563eb;
      --accent-dim: rgba(37, 99, 235, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1a;
        --surface: #111927;
        --surface-hover: #162032;
        --border: #1e293b;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --text-muted: #64748b;
        --accent: #60a5fa;
        --accent-dim: rgba(96, 165, 250, 0.15);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* ── Container ── */
    .container { 
      max-width: 820px; 
      margin: 0 auto; 
      padding: 0 2rem; 
    }

    /* ── Sections ── */
    section {
      border-bottom: 1px solid var(--border);
      padding: 3rem 0;
    }
    section:last-child { border-bottom: none; }

    /* ── Profile ── */
    .profile {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* When photo is hidden, content takes full width */
    .profile-grid:has(.profile-photo[style*="display:none"]) {
      grid-template-columns: 1fr;
    }

    .profile-photo {
      width: 150px;
      height: 150px;
      flex-shrink: 0;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .profile-content {
      min-width: 0;
    }

    .profile-name {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }

    .profile-title {
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .profile-bio {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 1.25rem;
    }

    .profile-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.9rem;
    }

    .profile-links .separator {
      color: var(--text-muted);
      margin: 0 0.25rem;
    }

    /* ── Section Headings ── */
    .section-heading {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    /* ── Research Interests ── */
    .research-interests {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.8;
    }

    /* ── News ── */
    .news-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .news-list li {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
    }

    .news-date {
      display: inline-block;
      min-width: 50px;
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 1rem;
    }

    /* ── Work Items ── */
    .work-list {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .work-item {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 1.5rem;
    }

    /* When thumbnail is hidden, content takes full width */
    .work-item:has(.work-thumbnail[style*="display:none"]) {
      grid-template-columns: 1fr;
    }

    .work-thumbnail {
      width: 120px;
      height: 90px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .work-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .work-content {
      min-width: 0;
    }

    .work-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .work-desc {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .work-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.85rem;
    }

    .work-links .separator {
      color: var(--text-muted);
      margin: 0 0.25rem;
    }

    /* ── Writing List ── */
    .writing-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .writing-item a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.5rem 0;
      gap: 1rem;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .writing-item a:hover {
      border-bottom-color: var(--border);
    }

    .writing-title {
      color: var(--text);
      font-size: 0.95rem;
      flex: 1;
    }

    .writing-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-links { display: flex; gap: 1.2rem; }
    .footer-links a {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .footer-links a:hover { 
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Post layout ── */
    section.post-section { border-bottom: none; }

    .post-header { margin: 2rem 0 2.5rem; }
    .post-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 0.6rem;
    }

    .post-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .post-meta .separat { margin: 0 0.3em; }

    .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .post-body {
      color: var(--text-dim);
      line-height: 1.85;
      font-size: 0.94rem;
    }
    .post-body h1,
    .post-body h2,
    .post-body h3 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      color: var(--text);
      margin: 2rem 0 0.8rem;
    }
    .post-body h1 { font-size: 1.5rem; }
    .post-body h2 { font-size: 1.25rem; }
    .post-body h3 { font-size: 1.1rem; }

    .post-body p,
    .post-body li {
      margin-bottom: 1.1rem;
    }

    .post-body ul, .post-body ol {
      padding-left: 1.6rem;
      margin-bottom: 1.2rem;
    }

    .post-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .post-body a:hover { border-bottom-color: var(--accent); }

    .post-body strong { color: var(--text); font-weight: 600; }

    .post-body img,
    .post-body figure img,
    .post-body figcaption {
      max-width: 100%;
    }

    .post-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-dim);
      margin: 1.5rem 0;
      font-style: italic;
    }

    .post-body code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.85em;
    }

    .post-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.2rem 1.4rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      border-radius: 6px;
    }
    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.84em;
    }

    .post-body figure {
      margin: 2rem 0;
      padding: 0.75rem;
      background: #FDFCF8;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .post-body figure img { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .post-body figcaption {
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px solid #ddd6cc;
      color: #4a453f;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .post-body figcaption strong { color: #2E2A26; }

    @media (prefers-color-scheme: dark) {
      .post-body figure {
        background: var(--surface);
      }
      .post-body figcaption {
        border-top-color: var(--border);
        color: var(--text-dim);
      }
      .post-body figcaption strong {
        color: var(--text);
      }
    }

    .post-body .highlight .c, .post-body .highlight .c1, .post-body .highlight .cm { color: #5a7a5a; font-style: italic; }
    .post-body .highlight .k, .post-body .highlight .kn, .post-body .highlight .kd, .post-body .highlight .ow { color: #6ad46a; }
    .post-body .highlight .s, .post-body .highlight .s1, .post-body .highlight .s2, .post-body .highlight .sb { color: #c8e6a0; }
    .post-body .highlight .nf, .post-body .highlight .nb { color: #9fe0c8; }
    .post-body .highlight .mi, .post-body .highlight .mf { color: #d8c08a; }
    .post-body .highlight .o, .post-body .highlight .p { color: #8aae8a; }

    .post-body table {
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.82rem;
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .post-body th, .post-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    .post-body thead th {
      color: var(--accent);
      background: rgba(96, 165, 250, 0.04);
      font-weight: 600;
    }
    .post-body tbody tr:nth-child(even) { background: rgba(17, 25, 39, 0.4); }

    /* ═══ Responsive ═══ */
    @media (max-width: 640px) {
      .container, footer { 
        padding-left: 1.2rem; 
        padding-right: 1.2rem; 
      }
      
      .profile-grid {
        grid-template-columns: 100px 1fr;
        gap: 1.5rem;
      }

      .profile-grid:has(.profile-photo[style*="display:none"]) {
        grid-template-columns: 1fr;
      }
      
      .profile-photo {
        width: 100px;
        height: 100px;
      }
      
      .profile-name {
        font-size: 1.6rem;
      }
      
      .work-item {
        grid-template-columns: 1fr;
      }
      
      .work-thumbnail {
        width: 100%;
        height: 150px;
      }
    }
  </style>

  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true }, svg: { fontCache: 'global' } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei" crossorigin="anonymous"></script>
</head>
<body>

<div class="container" style="padding-top: 1.5rem; padding-bottom: 0.5rem;">
  <nav style="display: flex; justify-content: space-between; align-items: center;">
    <a href="/" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 1.05rem; color: var(--text); text-decoration: none;">Spandan Mishra</a>
    <div style="display: flex; gap: 2rem; font-size: 0.9rem;">
      <a href="/" rel="noopener noreferrer">Home</a>
      <a href="/blog/" rel="noopener noreferrer">Blog</a>
      <a href="/assets/cv/Spandan_Mishra_CV.pdf" rel="noopener noreferrer" target="_blank">CV</a>
      <a href="https://github.com/Spandyie" rel="noopener noreferrer" target="_blank">GitHub</a>
      <a href="https://scholar.google.com/citations?user=WGEmEPcAAAAJ" rel="noopener noreferrer" target="_blank">Scholar</a>
    </div>
  </nav>
</div>

<div class="container">
{{ content }}
</div>

<!-- ═══ Footer ═══ -->
<footer>
  <span class="footer-text">&copy; {{ 'now' | date: '%Y' }} Spandan Mishra</span>
  <div class="footer-links">
    <a href="https://github.com/Spandyie" rel="noopener noreferrer" target="_blank">GitHub</a>
    <a href="/blog/feed.xml" rel="noopener noreferrer">RSS</a>
  </div>
</footer>

{{ page.extra_js }}
</body>
</html>
