<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════ Design System ═══════════════════ */
    :root {
      --bg: #0a0f1a;
      --surface: #111927;
      --surface-hover: #162032;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --accent: #60a5fa;
      --accent-dim: rgba(96, 165, 250, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Topbar ── */
    .topbar {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.25rem 2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .topbar-logo {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .topbar nav { display: flex; gap: 2rem; align-items: center; }
    .topbar nav a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    .topbar nav a:hover { color: var(--accent); }
    .topbar nav a.active { color: var(--text); }

    /* ── Section wrapper ── */
    .container { max-width: 820px; margin: 0 auto; padding: 0 2rem; }

    /* ── Sections ── */
    section {
      border-bottom: 1px solid var(--border);
      padding: 3.5rem 0;
    }
    section:last-child { border-bottom: none; }

    /* Section labels */
    .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* ── Hero ── */
    .hero {
      border-bottom: none;
      padding: 3rem 0 4rem;
      text-align: center;
    }

    .hero-logo {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      line-height: 1;
      margin-bottom: 1.2rem;
    }

    .hero-name {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
      line-height: 1.15;
    }

    .hero-tagline {
      font-size: 1rem;
      color: var(--text-dim);
      max-width: 520px;
      margin: 0 auto 1.8rem;
      line-height: 1.65;
    }

    .hero-link {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .hero-link:hover { border-bottom-color: var(--accent); }

    /* ── Whoami block ── */
    .whoami-text {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.8;
      max-width: 680px;
    }

    /* ── Skill rows ── */
    .skill-list { display: grid; gap: 0.35rem; }

    .skill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.45rem 0;
    }

    .skill-name {
      font-size: 0.88rem;
      color: var(--text);
      font-weight: 500;
      width: 140px;
      flex-shrink: 0;
      text-align: right;
    }

    .skill-bar {
      flex: 1;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }

    .skill-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }

    .skill-pct {
      font-size: 0.78rem;
      color: var(--text-muted);
      width: 35px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Projects ── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.1rem 1.2rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .project-card:hover {
      border-color: #2a3a55;
      background: var(--surface-hover);
    }

    .project-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.45rem;
      text-decoration: none;
      display: inline-block;
    }
    .project-title:hover { text-decoration: underline; }

    .project-desc {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 0.7rem;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tech-tag {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(96, 165, 250, 0.06);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 0.02em;
    }

    /* ── Contact ── */
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s;
    }
    .contact-link:hover { color: var(--accent); }

    /* ── Contact form ── */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1.5rem;
      max-width: 420px;
    }

    .contact-form input,
    .contact-form textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      outline: none;
      border-radius: 4px;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--accent);
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: var(--text-muted);
    }

    .contact-form button {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.5rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .contact-form button:hover {
      background: var(--accent-dim);
    }
    .contact-form button:disabled { opacity: 0.5; cursor: not-allowed; }

    #form-status { font-size: 0.8rem; min-height: 1.2rem; }

    /* ── Blog showcase ── */
    .blog-list { list-style: none; }

    .blog-item {
      display: grid;
      grid-template-columns: 95px 1fr auto;
      gap: 1.2rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
    }
    .blog-item:first-child { border-top: 1px solid var(--border); }

    .blog-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .blog-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      transition: color 0.15s;
    }
    .blog-item:hover .blog-title { color: var(--accent); }

    .blog-arrow {
      font-size: 0.9rem;
      color: var(--text-muted);
      flex-shrink: 0;
      align-self: center;
      transition: transform 0.15s, color 0.15s;
    }
    .blog-item:hover .blog-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .footer-links { display: flex; gap: 1.2rem; }
    .footer-links a {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--accent); }

    /* ── Post layout ── */
    section.post-section { border-bottom: none; }

    .post-header { margin: 2rem 0 2.5rem; }
    .post-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 0.6rem;
    }

    .post-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .post-meta .separat { margin: 0 0.3em; }

    .post-body {
      color: var(--text-dim);
      line-height: 1.85;
      font-size: 0.94rem;
    }
    .post-body h1,
    .post-body h2,
    .post-body h3 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      color: var(--text);
      margin: 2rem 0 0.8rem;
    }
    .post-body h1 { font-size: 1.5rem; }
    .post-body h2 { font-size: 1.25rem; }
    .post-body h3 { font-size: 1.1rem; }

    .post-body p,
    .post-body li {
      margin-bottom: 1.1rem;
    }

    .post-body ul, .post-body ol {
      padding-left: 1.6rem;
      margin-bottom: 1.2rem;
    }

    .post-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .post-body a:hover { border-bottom-color: var(--accent); }

    .post-body strong { color: var(--text); font-weight: 600; }

    .post-body img,
    .post-body figure img,
    .post-body figcaption {
      max-width: 100%;
    }

    .post-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-dim);
      margin: 1.5rem 0;
      font-style: italic;
    }

    .post-body code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.85em;
    }

    .post-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.2rem 1.4rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      border-radius: 6px;
    }
    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.84em;
    }

    /* Figures (SVGs carry their own light canvas) */
    .post-body figure {
      margin: 2rem 0;
      padding: 0.75rem;
      background: #FDFCF8;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .post-body figure img { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .post-body figcaption {
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px solid #ddd6cc;
      color: #4a453f;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .post-body figcaption strong { color: #2E2A26; }

    /* Rouge syntax highlighting */
    .post-body .highlight .c, .post-body .highlight .c1, .post-body .highlight .cm { color: #5a7a5a; font-style: italic; }
    .post-body .highlight .k, .post-body .highlight .kn, .post-body .highlight .kd, .post-body .highlight .ow { color: #6ad46a; }
    .post-body .highlight .s, .post-body .highlight .s1, .post-body .highlight .s2, .post-body .highlight .sb { color: #c8e6a0; }
    .post-body .highlight .nf, .post-body .highlight .nb { color: #9fe0c8; }
    .post-body .highlight .mi, .post-body .highlight .mf { color: #d8c08a; }
    .post-body .highlight .o, .post-body .highlight .p { color: #8aae8a; }

    /* Tables */
    .post-body table {
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.82rem;
      display: block;
      max-width: 100%;
      overflow-x: auto;
    }
    .post-body th, .post-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    .post-body thead th {
      color: var(--accent);
      background: rgba(96, 165, 250, 0.04);
      font-weight: 600;
    }
    .post-body tbody tr:nth-child(even) { background: rgba(17, 25, 39, 0.4); }

    /* ── Inline code highlight style --> */
    .inline-code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.85em;
    }

    /* ═══ Responsive ═══ */
    @media (max-width: 540px) {
      .container, .topbar, footer { padding-left: 1.2rem; padding-right: 1.2rem; }
      .projects-grid { grid-template-columns: 1fr; }
      .contact-links { flex-direction: column; gap: 1rem; }
      .blog-item { grid-template-columns: 80px 1fr auto; gap: 0.6rem; font-size: 0.92rem; }
      .skill-name { width: 110px; font-size: 0.82rem; }
      .hero-logo { font-size: 3rem; }
    }

    @media (prefers-color-scheme: light) and (display-p3) { /* no-op fallback */ }
  </style>

  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true }, svg: { fontCache: 'global' } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<!-- ═══ Topbar ═══ -->
<div class="topbar">
  <a href="/" class="topbar-logo">Spandan Mishra</a>
  <nav>
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="https://github.com/Spandyie" target="_blank">GitHub</a>
    <a href="https://scholar.google.com/citations?user=WGEmEPcAAAAJ&hl=en" target="_blank">Scholar</a>
  </nav>
</div>

<div class="container">
{{ content }}
</div>

<!-- ═══ Footer ═══ -->
<footer>
  <span class="footer-text">&copy; {{ 'now' | date: '%Y' }} Spandan Mishra</span>
  <div class="footer-links">
    <a href="https://github.com/Spandyie" target="_blank">GitHub</a>
    <a href="/blog/feed.xml">RSS</a>
  </div>
</footer>

{{ page.extra_js }}
<script>
  {% raw %}

  // ── Skill bar animation on scroll ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('.skill-fill').forEach(el => {
          el.style.transition = 'width 1s cubic-bezier(0.4,0,0.2,1)';
          el.style.width = el.dataset.w + '%';
        });
        observer.disconnect();
      }
    });
  }, { threshold: 0.3 });

  const skillsSection = document.querySelector('#skills-output') || document.querySelector('.skill-list');
  if (skillsSection) observer.observe(skillsSection);

  {% endraw %}
</script>
</body>
</html>
