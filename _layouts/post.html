---
layout: default
---

<section class="post-section container">
  <div class="post-header">
    <div class="label">Blog post</div>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% for tag in page.tags %}<span class="separat">&#8226;</span>{{ tag }}{% endfor %}
    </div>
  </div>

  <div class="post-body">
    {{ content }}
  </div>

  <!-- Comments -->
  <div style="border-top:1px solid var(--border);margin:3rem 0;"></div>
  <div style="font-family:'Source Serif 4',Georgia,serif;font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem">Comments</div>
  <script src="https://giscus.app/client.js"
          data-repo="Spandyie/spandyie.github.io"
          data-repo-id="R_kgDON6PzLw"
          data-category="Announcements"
          data-category-id="DIC_kwDON6PzL84C_O8p"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="transparent_dark"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>

  <div style="border-top:1px solid var(--border);margin:2.5rem 0 1rem;"></div>
  <a href="/blog/" rel="noopener noreferrer" style="font-size:0.85rem;color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--border)">← back to blog</a>
</section>
